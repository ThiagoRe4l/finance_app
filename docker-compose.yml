# Finance App — orquestração do ambiente de desenvolvimento.
#
# Formaliza os comandos que hoje são executados à mão (ver CLAUDE.md, seção
# "Comandos de Execução"). Nada de novo é introduzido aqui: mesmas portas,
# mesmos comandos, mesmo caminho de banco.
#
#   docker compose up            # sobe backend + frontend
#   docker compose up backend    # só a API
#   docker compose run --rm backend pytest    # suíte de testes
#
# Não há Dockerfile no projeto: os dois serviços rodam sobre imagens oficiais
# e instalam as dependências na subida. Se o build passar a precisar de passos
# próprios (compilar extensão nativa, etc.), aí sim vale extrair um Dockerfile.

services:
  backend:
    image: python:3.11-slim
    container_name: finance-backend
    # O caminho é obrigatório, não estético: `app/database.py` tem
    # DATABASE_DIR = "/workspace/backend" hardcoded. Montar em outro lugar faz
    # o SQLite ser criado fora do bind mount e os dados sumirem no down.
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      # venv em volume nomeado, fora do bind mount: evita que a .venv do host
      # (criada com outro interpretador/caminho) vaze para dentro do container.
      - backend-venv:/opt/venv
    environment:
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/backend
    command: >
      sh -c "test -x /opt/venv/bin/python || python -m venv /opt/venv &&
             pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      # Publicar 8000 no host não é opcional: o browser é quem chama a API,
      # usando o http://localhost:8000/api hardcoded em src/lib/api.ts.
      - "8000:8000"
    healthcheck:
      # GET /health, definido em app/main.py
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22-slim
    container_name: finance-frontend
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      # node_modules em volume nomeado pelo mesmo motivo da venv, e porque
      # binário nativo instalado no host (Windows) não roda no container Linux.
      - frontend-node-modules:/workspace/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

# Como os dois serviços se conectam
# --------------------------------
# NÃO é container→container. O bundle React roda no browser do host, e
# src/lib/api.ts aponta para http://localhost:8000/api — ou seja, o browser
# fala com a porta 8000 publicada, não com o serviço `backend` da rede interna.
# O `depends_on` aqui garante ordem de subida (evita tela em branco com a API
# ainda no ar), não roteamento.
#
# Se algum dia o frontend precisar chamar a API server-side (SSR/loader do
# TanStack Start rodando dentro do container), aí o host passa a ser
# http://backend:8000 e vai ser preciso parametrizar a URL base — hoje ela é
# uma constante, ver a seção "Variáveis de Ambiente" do CLAUDE.md.

volumes:
  backend-venv:
  frontend-node-modules:
