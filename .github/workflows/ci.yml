# Validador de código: suíte + lint antes de qualquer deploy.
#
# ⚠️ Enquanto o auto-deploy do Railway estiver ligado no push para `main`, este
# workflow é CONVENÇÃO, não mecanismo — o Railway não espera o Actions
# terminar. Mesma distinção que a seção 0.1 do CLAUDE.md faz sobre teste
# dependente de data. Virar mecanismo exige desligar o auto-deploy e disparar o
# deploy pelo CLI aqui dentro, depois dos jobs verdes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma minor do Dockerfile e do docker-compose. Divergir aqui é como
          # a suíte fica verde contra um interpretador que não é o de produção.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # ⚠️ Este job **não** define `DATABASE_URL`, de propósito: é o único lugar
      # que exercita o **default** de `resolve_database_url` num filesystem que
      # não é o container de desenvolvimento. Foi exatamente aí que o primeiro
      # CI quebrou — o default era `/workspace/backend/database.db`, caminho que
      # só existe aqui dentro. Definir a variável deixaria o default sem
      # cobertura e o bug voltaria sem ninguém notar.
      #
      # Sem PYTHONPATH: `backend/pytest.ini` tem `pythonpath = .`
      - run: pytest

  # Mesma suíte, contra o Postgres real. Existe porque o desenvolvimento local
  # continua em SQLite (D-Vercel-1) e há divergências de dialeto que só o motor
  # de produção revela.
  #
  # 🔴 O ponto que este job existe para provar: as 6 cláusulas `ondelete` da
  # migration inicial. Ler o arquivo gerado pelo `--autogenerate` não é
  # verificação — CASCADE, RESTRICT e SET NULL precisam ser vistos funcionando
  # no motor que roda em produção. O schema aqui é construído pela **migration**
  # (`conftest._create_schema` roda `alembic upgrade head`), não por
  # `create_all()`: sem isso a suíte validaria os models e a migration poderia
  # divergir sem nada denunciar.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        # Sem healthcheck o job começa antes de o banco aceitar conexão.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Governa o engine da **suíte** (`conftest`).
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_test
      # Governa o engine da **aplicação**, criado no import de `app.database`.
      #
      # 🔴 Sem esta linha o job não testava o que diz testar: `DATABASE_URL`
      # caía no default SQLite, então o engine da aplicação era SQLite mesmo
      # neste job, e foi assim que ele tentou preparar um diretório de SQLite e
      # morreu com PermissionError. Com ela, nenhum caminho de SQLite é tocado
      # aqui — e `test_foreign_keys_are_enforced_on_app_engine` passa a
      # exercitar o ramo Postgres, como sempre foi a intenção.
      DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Passo separado e nomeado de propósito: é a verificação das cláusulas
      # `ondelete`, e tem que ser legível no log sem caçar dentro da suíte.
      - name: FK cascade contra Postgres real (ondelete da migration)
        run: pytest tests/test_fk_cascade.py tests/test_category_fk.py -v

      - name: Suíte completa contra Postgres
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` e não `npm install`: respeita o lock e, em Linux, resolve os
      # binários nativos corretos. Os `win32` de esbuild/rollup no repositório
      # são debt local (bind mount do Windows), não do CI.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Testes (runner nativo do Node)
        run: npm test

      # Ligado depois de 89bbd86 (format) e do commit que trocou `any` por
      # `unknown`: `npm run lint` agora sai com 0 erros. Gate nasce verde, que
      # era a condição da D-Deploy-4.
      - name: Lint
        run: npm run lint
