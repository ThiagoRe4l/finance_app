# Validador de código: suíte + lint antes de qualquer deploy.
#
# ⚠️ Enquanto o auto-deploy do Railway estiver ligado no push para `main`, este
# workflow é CONVENÇÃO, não mecanismo — o Railway não espera o Actions
# terminar. Mesma distinção que a seção 0.1 do CLAUDE.md faz sobre teste
# dependente de data. Virar mecanismo exige desligar o auto-deploy e disparar o
# deploy pelo CLI aqui dentro, depois dos jobs verdes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma minor do Dockerfile e do docker-compose. Divergir aqui é como
          # a suíte fica verde contra um interpretador que não é o de produção.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Sem PYTHONPATH: `backend/pytest.ini` tem `pythonpath = .`
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` e não `npm install`: respeita o lock e, em Linux, resolve os
      # binários nativos corretos. Os `win32` de esbuild/rollup no repositório
      # são debt local (bind mount do Windows), não do CI.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Testes (runner nativo do Node)
        run: npm test

      # ⚠️ DESLIGADO DE PROPÓSITO — não é esquecimento.
      #
      # `npm run lint` acusa hoje ~844 erros de formatação Prettier em arquivos
      # que ninguém tocou. Ligado agora, o gate nasce vermelho, e gate que nasce
      # vermelho é ignorado em uma semana (D-Deploy-4).
      #
      # A ordem decidida é: commit isolado de `npm run format` PRIMEIRO, e só
      # então descomentar as duas linhas abaixo. O passo fica aqui, na forma
      # final, para que ligá-lo seja remover dois `#` — e para que a pendência
      # esteja visível no lugar onde será resolvida, não só no CLAUDE.md.
      #
      # - name: Lint
      #   run: npm run lint
